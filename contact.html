<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer> </script>
  <title>Contact Us - Netcaru Cyber Security</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="MyWebSite" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #111, #1a1a1a);
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .contact-container {
      max-width: 1200px;
      margin: 60px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      padding: 20px;
    }

    .contact-form {
      flex: 1 1 400px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .contact-form h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .input-group {
      position: relative;
      margin-bottom: 30px;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 20px 16px 8px;
      border: none;
      border-bottom: 2px solid #aaa;
      background: transparent;
      color: inherit;
      font-size: 16px;
      outline: none;
    }

    .input-group label {
      position: absolute;
      top: 20px;
      left: 16px;
      font-size: 16px;
      color: #aaa;
      transition: 0.3s;
      pointer-events: none;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label,
    .input-group textarea:focus + label,
    .input-group textarea:not(:placeholder-shown) + label {
      top: 4px;
      font-size: 12px;
      color: #6a82fb;
    }

    .cta-button {
      background: linear-gradient(to right, #5c6bc0, #6a82fb);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: 0.3s ease;
      box-shadow: 0 6px 20px rgba(92, 107, 192, 0.3);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(92, 107, 192, 0.4);
    }

    .map-container {
      flex: 1 1 400px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header class="navbar">
        <div class="logo">
          <a href="index.html">
            <img src="images/netcaru-high-resolution-logo-transparent.png" alt="Netcaru Logo" class="site-logo">
          </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
    
            <!-- ☰ Hamburger menu toggle for mobile -->
            <div class="menu-toggle">☰</div>
        </nav>
    </header>

  <main>
    <section class="contact-container">
        <form class="contact-form" action="https://formspree.io/f/xqapgjwp" method="POST">
            <div class="input-group">
                <input type="text" id="name" name="name" required>
                <label for="name">Name</label>
            </div>
            <div class="input-group">
                <input type="email" id="email" name="email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <textarea id="message" name="message" required></textarea>
                <label for="message">Message</label>
            </div>
        
            <!-- Optional Redirect After Submission -->
            <input type="hidden" name="_redirect" value="thankyou.html">
        
            <button type="submit" class="cta-button">Send</button>
        </form>        

      <div class="map-container" data-aos="fade-left">
        <h2>Find Us</h2>
        <div id="map"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Netcaru Cyber Security Consultancy</p>
  </footer>

  <!-- AOS Animation Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script>
  AOS.init();
</script>

<!-- Leaflet.js Map Library -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-sA+e2eRrO3z61n9F0gK+RfE6d9SoFfjpc8tHEeFJWgI="
  crossorigin=""
/>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-o9N1jvZr0FfygulzdbA7/AEy2+EfD4nLpM2U7N6DrRg="
  crossorigin=""
></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const map = L.map("map").setView([-1.286389, 36.817223], 14);

    // Add OpenStreetMap tiles
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Add marker
    L.marker([-1.286389, 36.817223])
      .addTo(map)
      .bindPopup("Netcaru Cyber Security HQ")
      .openPopup();
  });
</script>
</html>
